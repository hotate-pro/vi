<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グループ通話</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    #login-box { margin-top: 60px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; text-align: center; background: #1e1e1e; padding: 24px; border-radius: 12px; }
    input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; outline: none; }
    button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    #app-box { display: none; width: 100%; max-width: 1200px; flex-direction: column; align-items: center; }
    #controls { margin-bottom: 20px; display: flex; gap: 12px; }
    .btn-ctrl { background: #333; color: white; width: 130px; border-radius: 8px; font-weight: bold; padding: 10px; }
    .btn-ctrl.off { background: #dc3545; }
    #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; width: 100%; }
    video { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
    .my-video { transform: scaleX(-1); }
    #status-msg { color: #ff6b6b; margin-top: 10px; font-size: 14px; word-break: break-all; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/trystero@0.18.0/dist/trystero-nostr.min.js"></script>
</head>
<body>

  <div id="login-box">
    <h2 style="margin: 0 0 10px 0;">グループ通話</h2>
    <form id="login-form" onsubmit="return false;">
      <input type="password" id="pass-input" placeholder="パスワードを入力">
      <button type="submit" id="login-btn" style="width:100%; margin-top:10px;">入室する</button>
    </form>
    <div id="status-msg"></div>
  </div>

  <div id="app-box">
    <div id="controls">
      <button id="mic-btn" class="btn-ctrl">マイク: ON</button>
      <button id="cam-btn" class="btn-ctrl">カメラ: ON</button>
    </div>
    <div id="video-grid"></div>
  </div>

  <script>
    const SECRET_PASS = "1234";
    let localStream;
    let room;
    let isMicOn = true;
    let isCamOn = true;

    const statusMsg = document.getElementById('status-msg');
    document.getElementById('login-form').addEventListener('submit', joinGroup);

    async function joinGroup() {
      const input = document.getElementById('pass-input').value;
      
      if (input !== SECRET_PASS) {
        statusMsg.style.color = '#ff6b6b';
        statusMsg.textContent = 'パスワードが違います';
        return;
      }

      statusMsg.style.color = '#aaa';
      statusMsg.textContent = 'カメラ・マイクを起動中...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (e) {
        statusMsg.style.color = '#ff6b6b';
        statusMsg.textContent = 'カメラ・マイクの許可が必要です: ' + e.message;
        return;
      }

      document.getElementById('login-box').style.display = 'none';
      document.getElementById('app-box').style.display = 'flex';
      addVideo('me', localStream, true, true);

      try {
        const { joinRoom } = window.Trystero;
        room = joinRoom({ appId: 'my-group-call-app-2026' }, 'main-room-1234');

        room.onPeerJoin(peerId => {
          room.addStream(localStream, peerId);
        });

        room.onPeerStream((stream, peerId) => {
          addVideo(peerId, stream, false, false);
        });

        room.onPeerLeave(peerId => {
          const videoElem = document.getElementById(`v-${peerId}`);
          if (videoElem) videoElem.remove();
        });
      } catch (e) {
        alert('接続エラーが発生しました: ' + e.message);
      }
    }

    function addVideo(id, stream, isMuted, isMe) {
      if (document.getElementById(`v-${id}`)) return;
      const grid = document.getElementById('video-grid');
      const v = document.createElement('video');
      v.id = `v-${id}`;
      v.srcObject = stream;
      v.autoplay = true;
      v.playsInline = true;
      if (isMuted) v.muted = true;
      if (isMe) v.classList.add('my-video');
      grid.appendChild(v);
    }

    document.getElementById('mic-btn').addEventListener('click', () => {
      isMicOn = !isMicOn;
      localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
      const btn = document.getElementById('mic-btn');
      btn.textContent = `マイク: ${isMicOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('off', !isMicOn);
    });

    document.getElementById('cam-btn').addEventListener('click', () => {
      isCamOn = !isCamOn;
      localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
      const btn = document.getElementById('cam-btn');
      btn.textContent = `カメラ: ${isCamOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('off', !isCamOn);
    });
  </script>
</body>
</html>
