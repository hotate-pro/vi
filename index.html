<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルグループ通話</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS WebRTC Library (無料シグナリングサーバー使用) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mirror { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- 認証画面 (初期表示) -->
  <div id="auth-screen" class="flex-1 flex flex-col items-center justify-center p-4 transition-all duration-300">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-2 border border-indigo-500/30">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">グループ通話</h1>
        <p class="text-sm text-slate-400">合言葉（パスワード）を入力して入室してください</p>
      </div>

      <!-- パスワード入力フォーム -->
      <div class="space-y-4">
        <div>
          <label for="password-input" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">グループパスワード</label>
          <input type="password" id="password-input" placeholder="••••••••" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-center tracking-widest text-lg font-mono" />
        </div>

        <div id="error-toast" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs text-center font-medium">
          パスワードが正しくありません
        </div>

        <button onclick="handleLogin()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition duration-150 flex items-center justify-center space-x-2">
          <span>通話に参加する</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>

        <div class="text-center pt-2">
          <span class="text-xs text-slate-500">初期パスワード: <code class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">1234</code></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ビデオ通話画面 (ログイン後) -->
  <div id="call-screen" class="hidden flex-1 flex-col h-screen max-h-screen">
    <!-- ヘッダーバー -->
    <header class="h-16 border-b border-slate-800/80 px-6 flex items-center justify-between bg-slate-900/60 backdrop-blur-md">
      <div class="flex items-center space-x-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="font-semibold text-sm tracking-wide text-slate-200">グループ通話ルーム</span>
        <span id="participant-count-badge" class="px-2 py-0.5 text-xs bg-slate-800 text-slate-400 border border-slate-700 rounded-full">接続数: 1</span>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="addDemoPeer()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 rounded-lg transition flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>デモ参加者追加</span>
        </button>
      </div>
    </header>

    <!-- メインビデオグリッドエリア -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto">
      <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-7xl mx-auto h-full auto-rows-fr">
        <!-- ビデオ要素がここに追加されます -->
      </div>
    </main>

    <!-- コントロールバー -->
    <footer class="h-20 border-t border-slate-800/80 bg-slate-900/80 backdrop-blur-md flex items-center justify-center px-4">
      <div class="flex items-center space-x-4">
        <!-- マイクボタン -->
        <button id="mic-btn" onclick="toggleMic()" class="p-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl transition border border-slate-700/80 shadow-lg flex items-center justify-center group">
          <svg id="mic-icon-on" class="w-6 h-6 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
          <svg id="mic-icon-off" class="w-6 h-6 text-red-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
          </svg>
        </button>

        <!-- カメラボタン -->
        <button id="cam-btn" onclick="toggleCam()" class="p-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl transition border border-slate-700/80 shadow-lg flex items-center justify-center group">
          <svg id="cam-icon-on" class="w-6 h-6 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <svg id="cam-icon-off" class="w-6 h-6 text-red-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
          </svg>
        </button>

        <!-- 退室ボタン -->
        <button onclick="leaveCall()" class="px-6 py-4 bg-red-600 hover:bg-red-500 text-white font-medium rounded-2xl transition shadow-lg shadow-red-600/20 flex items-center space-x-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path>
          </svg>
          <span>退出</span>
        </button>
      </div>
    </footer>
  </div>

  <script>
    // パスワード設定（必要に応じて書き換えてください）
    const GROUP_PASSWORD = "1234";
    
    // グループ識別子（PeerJS用の共通 prefix）
    const ROOM_PREFIX = "my-unique-group-room-xyz-";
    
    let peer = null;
    let localStream = null;
    let myPeerId = "";
    let isMicOn = true;
    let isCamOn = true;
    let connectedCalls = {};
    let demoCount = 0;

    async function handleLogin() {
      const inputPwd = document.getElementById("password-input").value;
      const errorToast = document.getElementById("error-toast");

      if (inputPwd !== GROUP_PASSWORD) {
        errorToast.classList.remove("hidden");
        return;
      }
      errorToast.classList.add("hidden");

      // カメラ・マイクの準備
      await initMedia();

      // UI切り替え
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("call-screen").classList.remove("hidden");
      document.getElementById("call-screen").classList.add("flex");

      // PeerJS接続初期化（PeerJSの公式パブリックサーバーを完全無料で利用）
      initPeer();
    }

    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (err) {
        console.warn("実際のカメラが取得できないため、キャンバス描画の代替ストリームを使用します。", err);
        localStream = createFallbackStream();
      }
      addVideoCard("me", localStream, "あなた (自分)", true);
    }

    function initPeer() {
      // ランダムIDでPeer作成
      myPeerId = ROOM_PREFIX + Math.random().toString(36).substring(2, 9);
      peer = new Peer(myPeerId);

      peer.on('open', (id) => {
        console.log('PeerJSに接続完了 ID:', id);
        // 同じプレフィックスを持つ他のユーザーへ発信テスト（またはBroadcastChannel併用）
        setupBroadcastSignal();
      });

      // 着信処理
      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          addVideoCard(call.peer, remoteStream, `メンバー (${call.peer.slice(-4)})`, false);
        });
        connectedCalls[call.peer] = call;
      });
    }

    // ブラウザのタブ間・端末間での接続シグナル共有（簡易同調）
    function setupBroadcastSignal() {
      try {
        const bc = new BroadcastChannel("group_call_channel");
        bc.postMessage({ type: "join", peerId: myPeerId });

        bc.onmessage = (event) => {
          if (event.data.peerId === myPeerId) return;

          if (event.data.type === "join") {
            // 新しい参加者に電話をかける
            callPeer(event.data.peerId);
            // 自分の存在も応答
            bc.postMessage({ type: "exist", peerId: myPeerId });
          } else if (event.data.type === "exist") {
            callPeer(event.data.peerId);
          } else if (event.data.type === "leave") {
            removeVideoCard(event.data.peerId);
          }
        };

        window.addEventListener("beforeunload", () => {
          bc.postMessage({ type: "leave", peerId: myPeerId });
        });
      } catch (e) {
        console.log("BroadcastChannel非対応:", e);
      }
    }

    function callPeer(remotePeerId) {
      if (connectedCalls[remotePeerId] || !peer) return;
      const call = peer.call(remotePeerId, localStream);
      if (!call) return;

      call.on('stream', (remoteStream) => {
        addVideoCard(remotePeerId, remoteStream, `メンバー (${remotePeerId.slice(-4)})`, false);
      });
      connectedCalls[remotePeerId] = call;
    }

    function toggleMic() {
      if (!localStream) return;
      isMicOn = !isMicOn;
      localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);

      document.getElementById("mic-icon-on").classList.toggle("hidden", !isMicOn);
      document.getElementById("mic-icon-off").classList.toggle("hidden", isMicOn);
      document.getElementById("mic-btn").classList.toggle("bg-red-500/20", !isMicOn);
    }

    function toggleCam() {
      if (!localStream) return;
      isCamOn = !isCamOn;
      localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);

      document.getElementById("cam-icon-on").classList.toggle("hidden", !isCamOn);
      document.getElementById("cam-icon-off").classList.toggle("hidden", isCamOn);
      document.getElementById("cam-btn").classList.toggle("bg-red-500/20", !isCamOn);

      const meVideo = document.getElementById("video-me");
      if (meVideo) meVideo.style.opacity = isCamOn ? "1" : "0.1";
    }

    function leaveCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      
      document.getElementById("call-screen").classList.add("hidden");
      document.getElementById("call-screen").classList.remove("flex");
      document.getElementById("auth-screen").classList.remove("hidden");
      document.getElementById("video-grid").innerHTML = "";
      document.getElementById("password-input").value = "";
    }

    function addVideoCard(id, stream, label, isMe) {
      const grid = document.getElementById("video-grid");
      if (document.getElementById(`card-${id}`)) return;

      const card = document.createElement("div");
      card.id = `card-${id}`;
      card.className = "relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex items-center justify-center aspect-video";

      const video = document.createElement("video");
      video.id = `video-${id}`;
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
      video.className = `w-full h-full object-cover ${isMe ? "mirror" : ""}`;
      if (isMe) video.muted = true;

      const labelTag = document.createElement("div");
      labelTag.className = "absolute bottom-3 left-3 bg-slate-950/80 backdrop-blur-md border border-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-medium";
      labelTag.textContent = label;

      card.appendChild(video);
      card.appendChild(labelTag);
      grid.appendChild(card);

      updateCount();
    }

    function removeVideoCard(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
      delete connectedCalls[id];
      updateCount();
    }

    function updateCount() {
      const count = document.getElementById("video-grid").children.length;
      document.getElementById("participant-count-badge").textContent = `接続数: ${count}`;
    }

    // カメラがない環境用の疑似ストリーム作成
    function createFallbackStream() {
      const canvas = document.createElement("canvas");
      canvas.width = 640; canvas.height = 480;
      const ctx = canvas.getContext("2d");
      let hue = 200;
      setInterval(() => {
        hue = (hue + 1) % 360;
        ctx.fillStyle = `hsl(${hue}, 40%, 15%)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Inter";
        ctx.textAlign = "center";
        ctx.fillText("カメラ映像", canvas.width/2, canvas.height/2);
      }, 50);
      return canvas.captureStream(30);
    }

    function addDemoPeer() {
      demoCount++;
      const canvas = document.createElement("canvas");
      canvas.width = 640; canvas.height = 480;
      const ctx = canvas.getContext("2d");
      setInterval(() => {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#6366f1";
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 50, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Inter";
        ctx.textAlign = "center";
        ctx.fillText(`デモ参加者 #${demoCount}`, canvas.width/2, canvas.height/2 + 80);
      }, 50);
      addVideoCard(`demo-${demoCount}`, canvas.captureStream(30), `デモ参加者 #${demoCount}`, false);
    }

    document.getElementById("password-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
